name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 仓库 rust-toolchain.toml 里 pin 的是 Windows host 工具链，
      # Linux 上用环境变量覆盖掉它。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk

      - name: Export CARGO_HOME
        run: echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"

      - name: Build universal APK
        working-directory: flutter
        run: |
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          CODE="$(echo "$VERSION" | awk -F. '{print $1*10000+$2*100+$3}')"
          flutter pub get --enforce-lockfile
          mkdir -p build/symbols
          flutter build apk --release --no-pub \
            --build-name="$VERSION" \
            --build-number="$CODE" \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate \
            --dart-define="FUSIONPLAY_VERSION=$VERSION" \
            --split-debug-info=build/symbols
          mkdir -p ../artifacts/releases
          cp build/app/outputs/flutter-apk/app-release.apk "../artifacts/releases/FusionPlay-Android-$VERSION.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionPlay-Android-APK
          path: artifacts/releases/*.apk
          if-no-files-found: error
