name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Configure Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'ANDROID_SDK_ROOT is not set on the runner.' }
          Add-Content $env:GITHUB_ENV "ANDROID_HOME=$sdk"
          Add-Content $env:GITHUB_ENV "ANDROID_SDK_ROOT=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\cmdline-tools\latest\bin"
          Add-Content $env:GITHUB_PATH "$sdk\platform-tools"

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          1..200 | ForEach-Object { 'y' } | sdkmanager --licenses | Out-Null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Rust Android targets
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android --toolchain stable-x86_64-pc-windows-gnullvm
          cargo install cargo-ndk --locked

      - name: Export CARGO_HOME
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "CARGO_HOME=$(Join-Path $env:USERPROFILE '.cargo')"

      - name: Build universal APK
        shell: pwsh
        run: ./flutter/tool/build_universal.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionPlay-Android-APK
          path: artifacts/releases/*.apk
          if-no-files-found: error
